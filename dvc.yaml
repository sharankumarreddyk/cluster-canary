# DVC pipeline — fill in stages as each phase lands.
# Run `dvc repro <stage>` after the stage's deps/outs exist.
stages:
  scrape:
    cmd: python -m cluster_canary.pipelines.scrape
    deps:
      - src/cluster_canary/data/scraper.py
      - src/cluster_canary/data/label_generator.py
      - src/cluster_canary/data/schema.py
      - src/cluster_canary/pipelines/scrape.py
    outs:
      - data/raw/scrape/
      - data/interim/labeled/
    metrics:
      - reports/eval/label_metrics.json:
          cache: false
    desc: "Phase 1 — Scrape Prometheus → parquet + generate event_within_30min labels"

  alibaba:
    cmd: python -m cluster_canary.pipelines.alibaba
    deps:
      - src/cluster_canary/data/alibaba_ingest.py
      - src/cluster_canary/data/alibaba_harmonize.py
      - src/cluster_canary/data/alibaba_oom_detector.py
      - src/cluster_canary/data/alibaba_schema.py
      - src/cluster_canary/pipelines/alibaba.py
    outs:
      - data/raw/alibaba/
      - data/interim/alibaba/
      - data/interim/alibaba_labeled/
    desc: "Phase 2 — Alibaba 2018 trace ingest + harmonize + window-label"

  features:
    cmd: python -m cluster_canary.pipelines.features
    deps:
      - src/cluster_canary/features/
      - src/cluster_canary/pipelines/features.py
      - data/interim/labeled/
      - data/interim/alibaba_labeled/
    outs:
      - data/processed/
    metrics:
      - reports/eval/feature_metrics.json:
          cache: false
      - reports/eval/split_metrics.json:
          cache: false
    desc: "Phase 3 — Feature engineering + 60/20/20 temporal split"

  train:
    cmd: python -m cluster_canary.pipelines.train
    deps:
      - src/cluster_canary/models/
      - src/cluster_canary/training/
      - src/cluster_canary/pipelines/train.py
      - data/processed/
    outs:
      - models/canary_model.txt
      - models/calibrator.pkl
      - models/MODEL_CARD.md
      - models/feature_list.json
    metrics:
      - reports/eval/test_metrics.json:
          cache: false
      - reports/eval/slice_metrics.json:
          cache: false
      - reports/eval/baseline_test_metrics.json:
          cache: false
    desc: "Phase 4 — Baseline + LightGBM (Optuna search) + calibration; MLflow-tracked"
