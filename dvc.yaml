# DVC pipeline — fill in stages as each phase lands.
# Run `dvc repro <stage>` after the stage's deps/outs exist.
stages:
  scrape:
    cmd: python -m cluster_canary.pipelines.scrape
    deps:
      - src/cluster_canary/data/scraper.py
      - src/cluster_canary/data/label_generator.py
      - src/cluster_canary/data/schema.py
      - src/cluster_canary/pipelines/scrape.py
    outs:
      - data/raw/scrape/
      - data/interim/labeled/
    metrics:
      - reports/eval/label_metrics.json:
          cache: false
    desc: "Phase 1 — Scrape Prometheus → parquet + generate event_within_30min labels"

  features:
    cmd: python -m cluster_canary.pipelines.features
    deps:
      - src/cluster_canary/features/
      - data/interim/labeled/
    outs:
      - data/processed/
    desc: "Phase 3 — Feature engineering + temporal/group split"

  train:
    cmd: python -m cluster_canary.training.train
    deps:
      - src/cluster_canary/models/
      - src/cluster_canary/training/
      - data/processed/
    metrics:
      - reports/eval/metrics.json:
          cache: false
    desc: "Phase 4 — Train + log to MLflow"
