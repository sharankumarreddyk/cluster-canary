[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cluster-canary"
version = "0.1.0"
description = "Predict Kubernetes pod failures (OOMKill, CrashLoopBackOff) before they happen — proactive ML layer for cluster health."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "sharankumarreddyk", email = "167206944+sharankumarreddyk@users.noreply.github.com" }]
keywords = ["mlops", "kubernetes", "sre", "failure-prediction", "lightgbm", "mlflow", "bentoml", "evidently"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Data
    "pandas>=2.2,<3.0",
    "pyarrow>=17.0",
    "numpy>=1.26,<2.0",
    # Models
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "torch>=2.4,<3.0",
    # Experiment tracking + data versioning
    "mlflow>=2.18,<3.0",
    "dvc[s3]>=3.55",
    # Monitoring
    "evidently>=0.5,<1.0",
    # Serving
    "bentoml>=1.3,<2.0",
    # Orchestration
    "prefect>=3.0,<4.0",
    # Hyperparameter search
    "optuna>=4.0",
    "optuna-integration[lightgbm]>=4.0",  # Phase 4: LightGBMPruningCallback split into a separate package in Optuna 4.x
    # Data quality
    "great-expectations>=1.0,<2.0",
    # Utilities
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "click>=8.1",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "prometheus-api-client>=0.5",  # Phase 1: scraper pulls metrics via Prom HTTP API
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "hypothesis>=6.115",
    "pre-commit>=4.0",
    "nbstripout>=0.7",
    "ipython>=8.27",
    "jupyterlab>=4.2",
    "types-requests",
    "pandas-stubs",
]
serve = [
    "locust>=2.31",
]

[project.scripts]
cluster_canary = "cluster_canary.cli:main"

[project.urls]
Homepage = "https://github.com/sharankumarreddyk/cluster-canary"
Repository = "https://github.com/sharankumarreddyk/cluster-canary"
Issues = "https://github.com/sharankumarreddyk/cluster-canary/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cluster_canary"]

# --- Ruff -------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["notebooks", "data", "models", "reports", "infra"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "C4",       # comprehensions
    "UP",       # pyupgrade
    "RUF",      # ruff-specific
    "SIM",      # simplify
    "PTH",      # use pathlib
    "ARG",      # unused args
    "PT",       # pytest style
    "D",        # docstrings
]
ignore = [
    "D100", "D104", "D107",  # missing-module/package/init docstrings — too noisy
    "E501",                   # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ARG", "S101"]
"src/cluster_canary/cli.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "lightgbm.*",
    "evidently.*",
    "bentoml.*",
    "dvc.*",
    "prefect.*",
    "great_expectations.*",
    "locust.*",
    "optuna.*",
    "mlflow.*",
    "sklearn.*",
]
ignore_missing_imports = true

# BentoML's `@bentoml.service` and `@bentoml.api` decorators aren't typed; in
# strict mode that trips `disallow_untyped_decorators` for every method we
# wrap. Disable for the serving module specifically — type-check the bodies,
# just not the decorator-induced indirection.
[[tool.mypy.overrides]]
module = "cluster_canary.serving.service"
disallow_untyped_decorators = false

# --- Pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=cluster_canary",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "slow: deselect with '-m \"not slow\"'",
    "integration: requires external services (MLflow, MinIO, etc.)",
    "needs_data: requires DVC-tracked data files to be present",
]

[tool.coverage.run]
branch = true
source = ["src/cluster_canary"]
omit = ["*/__init__.py", "*/cli.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
