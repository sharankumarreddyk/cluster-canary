name: cluster_canary-dev

# Local dev stack: MLflow + MinIO (S3) + Postgres backend store.
# Bring up with: `make dev-up`
# - MLflow UI:    http://localhost:5000
# - MinIO console: http://localhost:9001  (login: minioadmin / minioadmin)

services:
  postgres:
    image: postgres:16-alpine
    container_name: cluster_canary-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: cluster_canary-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: cluster_canary-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: |
      sh -c "
        set -e
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}
        mc mb --ignore-existing local/mlflow-artifacts
        mc mb --ignore-existing local/cluster_canary-dvc
        mc mb --ignore-existing local/cluster_canary-data
        echo 'buckets ready'
      "

  mlflow:
    image: python:3.12-slim
    container_name: cluster_canary-mlflow
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command:
      - bash
      - -c
      - |
        set -e
        pip install --no-cache-dir --quiet 'mlflow==2.18.0' boto3 psycopg2-binary
        mlflow server \
          --backend-store-uri postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow}@postgres:5432/${POSTGRES_DB:-mlflow} \
          --default-artifact-root s3://mlflow-artifacts/ \
          --host 0.0.0.0 \
          --port 5000
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health',timeout=2).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  pgdata:
  miniodata:
