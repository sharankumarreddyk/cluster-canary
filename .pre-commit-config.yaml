default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: '^infra/helm/.*templates/'  # helm templates use {{ }}
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff-format
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.7
          - pandas-stubs
          - types-requests
        args: ["--config-file=pyproject.toml"]
        files: ^src/

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout

  - repo: local
    hooks:
      - id: dvc-status
        name: dvc status (warn-only)
        entry: bash -c 'command -v dvc >/dev/null 2>&1 && dvc status -q || echo "[pre-commit] dvc not installed; skipping"'
        language: system
        pass_filenames: false
        stages: [pre-commit]
        verbose: true
