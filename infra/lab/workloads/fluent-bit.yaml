# Per-node log shipper — realistic "background noise" workload + DaemonSet
# pattern in the feature space (some pods are node-local infrastructure, not
# scheduled workloads). No log destination — just exercises the agent.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: workloads

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-read
rules:
  - apiGroups: [""]
    resources: [namespaces, pods]
    verbs: [get, list, watch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-read
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: workloads

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: workloads
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Daemon        Off
        Log_Level     info
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Parser            cri
        Tag               kube.*
        Refresh_Interval  10
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On

    [OUTPUT]
        Name  null
        Match *

  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: workloads
  labels:
    app: fluent-bit
    canary.lab/profile: daemonset
spec:
  selector:
    matchLabels: { app: fluent-bit }
  template:
    metadata:
      labels:
        app: fluent-bit
        canary.lab/profile: daemonset
    spec:
      serviceAccountName: fluent-bit
      tolerations:
        - operator: Exists
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:3.1
          ports:
            - { containerPort: 2020, name: http }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 100m, memory: 128Mi }
          volumeMounts:
            - { name: config,     mountPath: /fluent-bit/etc }
            - { name: varlog,     mountPath: /var/log }
            - { name: dockerlogs, mountPath: /var/lib/docker/containers, readOnly: true }
      volumes:
        - { name: config,     configMap: { name: fluent-bit-config } }
        - { name: varlog,     hostPath: { path: /var/log } }
        - { name: dockerlogs, hostPath: { path: /var/lib/docker/containers } }
