# Stateful-ish DB workload — slow start, real disk I/O, "production-shaped" memory profile.
# emptyDir (kind has no default StorageClass); restart loses state, which is fine for failure data.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: workloads
  labels:
    app: postgres
    canary.lab/profile: stateful
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels:
        app: postgres
        canary.lab/profile: stateful
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_DB,       value: lab }
            - { name: POSTGRES_USER,     value: lab }
            - { name: POSTGRES_PASSWORD, value: lab }
            - { name: PGDATA,            value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: [pg_isready, -U, lab, -d, lab] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - { name: data, emptyDir: {} }
