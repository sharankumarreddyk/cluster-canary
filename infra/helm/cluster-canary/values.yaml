# Default values for cluster-canary.
# Override at install time via `helm install -f my-values.yaml`.

image:
  repository: ghcr.io/sharankumarreddyk/cluster-canary
  tag: "0.1.0"          # overridden in CI to the git SHA
  pullPolicy: IfNotPresent

# Phase 4 produces models/canary_model.txt; package + ship in the image,
# or override modelPath to a mounted PVC for hot-swap during retraining.
model:
  version: "0.1.0"
  pathInImage: /app/models   # canary_model.txt + calibrator.pkl + feature_list.json

replicaCount: 3

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: 1000m
    memory: 1Gi

service:
  type: ClusterIP
  port: 3000           # HTTP (Prometheus + healthz)

# SLOs the service enforces at the application layer; the autoscaler scales
# replicas if p95 latency or pending-request queue grows.
slo:
  p95LatencyMs: 50
  maxConcurrencyPerReplica: 256
  maxBatchSize: 64
  maxBatchLatencyMs: 20

# K8s probes — `/healthz` is liveness (process up), `/readyz` is readiness
# (model loaded + warmup done). 15s grace period covers cold start.
probes:
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 6

# Horizontal Pod Autoscaler — scale up on either CPU or pending-request count.
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70
  # Pending-requests-per-replica trigger requires a custom metric source
  # (e.g. KEDA or Prometheus Adapter) — disabled by default.
  customMetrics:
    enabled: false

# PodDisruptionBudget — keep at least 2 replicas during voluntary disruptions.
pdb:
  enabled: true
  minAvailable: 2

# Prometheus ServiceMonitor — picked up by prometheus-operator. Disable if
# Prometheus is scraping via annotations instead.
serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s
  labels: {}

# Node placement — we want this near the workloads it predicts about; pinning
# is a tenant policy decision, not encoded here.
nodeSelector: {}
tolerations: []
affinity: {}

env:
  MLP1_LOG_LEVEL: INFO
  PROMETHEUS_PORT: "3000"
